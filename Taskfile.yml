# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
version: "3"
vars:
  MAIN: .
  BIN_DIR: ~/.local/bin
  EXECUTABLE: rig
  # Override with LIMA_GUEST=macos to target macOS 26 (Tahoe).
  LIMA_GUEST: ubuntu
  LIMA_INSTANCE: '{{if eq .LIMA_GUEST "macos"}}rig-macos-26{{else}}rig-ubuntu-2604{{end}}'
  LIMA_TEMPLATE: '{{if eq .LIMA_GUEST "macos"}}macos-26{{else}}ubuntu-26.04{{end}}'
  LIMA_WORKDIR: /tmp/rig
  LIMA_SNAPSHOT: clean
tasks:
  default:
    cmd: go run {{.MAIN}} {{.CLI_ARGS}}
    silent: true
  build:
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags="-s -w -X github.com/edsonjaramillo/rig/internal/application.Version={{.VERSION}}" -o {{.BIN_DIR}}/{{.EXECUTABLE}} {{.MAIN}}
    silent: true
  test:
    cmd: go test ./...
    silent: true
  lint:
    cmd: golangci-lint run ./...
    silent: true
  format:
    cmd: gofumpt -w .
    silent: true

  lima:create:
    desc: Create an isolated VM (LIMA_GUEST=ubuntu or macos)
    preconditions:
      - sh: test "{{.LIMA_GUEST}}" = ubuntu || test "{{.LIMA_GUEST}}" = macos
        msg: 'Unsupported LIMA_GUEST={{.LIMA_GUEST}}; use ubuntu or macos'
    cmd: >-
      limactl start
      --name {{.LIMA_INSTANCE}}
      --mount-none
      --containerd=none
      --cpus 4
      --memory 4
      --disk 30
      template:{{.LIMA_TEMPLATE}}

  lima:shell:
    desc: Open a shell in the test VM
    cmd: limactl shell {{.LIMA_INSTANCE}}

  lima:info:
    desc: Show the VM OS, architecture, and installer state
    cmd: >-
      limactl shell {{.LIMA_INSTANCE}} -- bash -lc
      'if [ "$(uname -s)" = Darwin ]; then
        sw_vers;
      else
        cat /etc/os-release;
        systemctl is-system-running || true;
      fi;
      uname -m;
      command -v nix || echo "Nix not installed";
      command -v brew || echo "Homebrew not installed"'

  lima:snapshot:
    desc: Snapshot the clean VM before running installers
    cmd: limactl snapshot create {{.LIMA_INSTANCE}} --tag {{.LIMA_SNAPSHOT}}

  lima:copy:
    desc: Copy the current source tree into the VM
    cmds:
      - limactl shell {{.LIMA_INSTANCE}} -- rm -rf {{.LIMA_WORKDIR}}
      - limactl copy -r . {{.LIMA_INSTANCE}}:{{.LIMA_WORKDIR}}

  lima:build:
    desc: Install Go in the VM, copy the source, and build rig
    deps: [lima:copy]
    cmds:
      - limactl shell {{.LIMA_INSTANCE}} -- sudo apt-get update
      - limactl shell {{.LIMA_INSTANCE}} -- sudo apt-get install -y golang-go
      - >-
        limactl shell {{.LIMA_INSTANCE}} -- bash -lc
        'cd {{.LIMA_WORKDIR}} && go build -o {{.EXECUTABLE}} {{.MAIN}}'

  lima:run:
    desc: Run rig in the VM; pass arguments after --
    cmd: >-
      limactl shell {{.LIMA_INSTANCE}} -- bash -lc
      'cd {{.LIMA_WORKDIR}} && sudo ./{{.EXECUTABLE}} {{.CLI_ARGS}}'

  lima:verify:
    desc: Verify Nix and Homebrew after installation
    cmd: >-
      limactl shell {{.LIMA_INSTANCE}} -- bash -lc
      'nix --version;
      brew --version;
      nix doctor'

  lima:reset:
    desc: Restore the VM to its clean snapshot
    cmds:
      - limactl stop {{.LIMA_INSTANCE}}
      - limactl snapshot apply {{.LIMA_INSTANCE}} --tag {{.LIMA_SNAPSHOT}}
      - limactl start {{.LIMA_INSTANCE}}

  lima:delete:
    desc: Delete the disposable VM
    prompt: This will delete the {{.LIMA_INSTANCE}} VM. Continue?
    cmds:
      - limactl stop {{.LIMA_INSTANCE}}
      - limactl delete {{.LIMA_INSTANCE}}

  lima:macos:create:
    desc: Create the macOS 26 (Tahoe) VM
    cmds:
      - task: lima:create
        vars:
          LIMA_GUEST: macos
          LIMA_INSTANCE: rig-macos-26
          LIMA_TEMPLATE: macos-26

  lima:macos:shell:
    desc: Open a shell in the macOS 26 VM
    cmds:
      - task: lima:shell
        vars: {LIMA_INSTANCE: rig-macos-26}

  lima:macos:info:
    desc: Show the macOS 26 VM and installer state
    cmds:
      - task: lima:info
        vars: {LIMA_INSTANCE: rig-macos-26}

  lima:macos:delete:
    desc: Delete the macOS 26 VM
    cmds:
      - task: lima:delete
        vars: {LIMA_INSTANCE: rig-macos-26}
